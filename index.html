<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuele Casabianca — Fotografo, Videomaker e Regista</title>
  <meta name="description" content="Portfolio di Samuele Casabianca, fotografo, videomaker e regista con sede a Milano.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Favicon: logo su fondo pieno --color-bg, leggibile su tema chiaro e scuro (vedi PROGRESS.md) -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
</head>
<body>

  <!-- Splash screen di benvenuto (vedi js/splash.js): il logo viene "ritagliato"
       fuori dal buio da due punti di luce che ne percorrono il perimetro, poi
       l'intero riquadro vola e si trasforma nel logo reale della nav -->
  <div class="splash" aria-hidden="true">
    <div class="splash-stage">
      <div class="splash-frame">
        <img src="assets/logo-sc.png" alt="Samuele Casabianca — logo" class="splash-frame-logo">
      </div>
      <span class="splash-dot splash-dot--cw"></span>
      <span class="splash-dot splash-dot--ccw"></span>
    </div>
  </div>

  <!-- Nav minimale: solo monogramma + hamburger (la landing è essa stessa il menu) -->
  <header class="site-nav">
    <a class="logo-sc" href="index.html" aria-label="Torna alla home"><img src="assets/logo-sc.png" alt="Samuele Casabianca — logo"></a>
    <div class="nav-right">
      <button class="nav-burger" aria-label="Apri il menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Nome sopra i pannelli -->
  <div class="hero-name">
    <div class="script">Samuele</div>
    <div class="surname">Casabianca</div>
    <div class="tagline">Fotografo, Videomaker e Regista</div>
  </div>

  <!-- Pannelli verticali della landing -->
  <main class="panels panels--landing">
    <!-- Prima foto = quella a riposo: Samuele dietro le telecamere (verona-3).
         Ogni foto ha la sua inquadratura (percorso + background-position): le
         tre orizzontali hanno il viso nel terzo sinistro e vanno spostate a
         sinistra, altrimenti il pannello stretto mostra solo i cavalletti
         (in verona-1/2 il viso è all'altezza del titolo, quindi viene tenuto
         alla sua sinistra invece che sotto la scritta); il
         ritratto verticale va ancorato in alto, altrimenti quando il pannello
         si allarga (o su mobile) il ritaglio taglia la testa. -->
    <a class="panel" href="chi-sono.html" data-images="assets/foto/chi-sono/verona-3.jpg 25% center,assets/foto/chi-sono/verona-1.jpg 37% center,assets/foto/chi-sono/verona-2.jpg 30% center,assets/foto/chi-sono/profilo.jpg center 10%">
      <span class="panel-title">Chi Sono</span>
    </a>
    <!-- Collage a scorrimento continuo (panel--scroll, vedi js/panels.js):
         12 foto, 3 per categoria (celebrazioni, eventi, programmi TV, sport),
         alternate fra le due colonne; le verticali cadono negli slot alti -->
    <a class="panel panel--scroll" href="lavoro.html" data-images="assets/foto/eventi-aziendali/1_41.jpg,assets/foto/programmi-tv/_E7A5336.jpg,assets/foto/celebrazioni-matrimonio/_E7A2228.jpg,assets/foto/sport-rugby/1_164.jpg,assets/foto/programmi-tv/_E7A6711.jpg,assets/foto/celebrazioni-feste/1_104.jpg,assets/foto/sport-rugby/1_30.jpg,assets/foto/programmi-tv/_E7A6087.jpg,assets/foto/celebrazioni-matrimonio/12529.jpg,assets/foto/eventi-aziendali/_E7A8313.jpg,assets/foto/eventi-aziendali/1_114.jpg,assets/foto/sport-rugby/1_104.jpg">
      <span class="panel-title">Il Mio Lavoro</span>
    </a>
    <!-- Cinque immagini in crossfade: la conversazione a un evento, il
         dettaglio delle mani, il brindisi al tavolo, più le due immagini di
         assets/foto/contattami/ (le reflex, le icone di contatto) alternate
         alle foto. Quelle due hanno toni fuori palette e sono armonizzate con
         filtri CSS (vedi css/style.css, "Pannello Contattami"); la reflex è
         inquadrata sulla fotocamera di sinistra. A riposo resta la prima. -->
    <a class="panel" href="contattami.html" data-images="assets/foto/eventi-aziendali/1_20.jpg,assets/foto/contattami/theregisti-HSXIp58yPyI-unsplash.jpg 20% center,assets/foto/celebrazioni-matrimonio/12595.jpg,assets/foto/contattami/27ea25b6-e29c-4706-a847-8963692778ee.jpg,assets/foto/celebrazioni-feste/1_104.jpg">
      <span class="panel-title">Contattami</span>
    </a>
  </main>

  <!-- Riga social sotto i pannelli: icone SVG inline (nessuna risorsa esterna) -->
  <nav class="social-links" aria-label="Profili social">
    <a class="social-link" href="https://www.instagram.com/ph.samuele/?hl=it" target="_blank" rel="noopener" aria-label="Instagram di Samuele Casabianca (si apre in una nuova scheda)">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
      </svg>
    </a>
    <a class="social-link" href="https://www.linkedin.com/in/samuele-casabianca-0387b7237/" target="_blank" rel="noopener" aria-label="LinkedIn di Samuele Casabianca (si apre in una nuova scheda)">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/>
        <rect x="2" y="9" width="4" height="12"/>
        <circle cx="4" cy="4" r="2"/>
      </svg>
    </a>
  </nav>

  <script src="js/splash.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/main.js"></script>
  <script>
    initVerticalPanels();
  </script>
</body>
</html>
