<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video — Samuele Casabianca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-nav site-nav--solid">
    <a class="logo-sc" href="index.html" aria-label="Torna alla home"><img src="assets/logo-sc.png" alt="Samuele Casabianca — logo"></a>
    <nav class="breadcrumb" aria-label="Percorso">
      <a href="lavoro.html">Lavoro</a>
      <span class="sep">/</span>
      <span aria-current="page">Video</span>
    </nav>
    <div class="nav-right">
      <a class="nav-contact" href="contattami.html">Contattami</a>
      <button class="nav-burger" aria-label="Apri il menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="page-content">
    <div class="page-heading">
      <h1>Video</h1>
      <p>I video di eventi, matrimoni e giornate sportive raccontati da Samuele.</p>
    </div>

    <div class="filter-chips" id="filter-chips">
      <button class="chip is-active" data-filter="tutti">Tutti</button>
      <button class="chip" data-filter="eventi">Eventi</button>
      <button class="chip" data-filter="matrimoni">Matrimoni</button>
      <button class="chip" data-filter="sport">Sport</button>
    </div>

    <!-- Griglia stile piattaforma video: popolata da JS a partire da VIDEO_DATA (js/video-data.js) -->
    <div class="video-grid" id="video-grid"></div>
  </main>

  <footer class="site-footer">
    <a class="logo-sc" href="index.html" aria-label="Torna alla home"><img src="assets/logo-sc.png" alt="Samuele Casabianca — logo"></a>
    <span>Samuele Casabianca — Fotografo, Videomaker e Regista</span>
  </footer>

  <script src="js/video-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('video-grid').innerHTML = VIDEO_DATA.map((v) => `
      <a class="video-card" href="video-watch.html?v=${v.id}&cat=${v.categoria}" data-categoria="${v.categoria}">
        ${videoThumbHtml(v)}
        <div class="video-info">
          <div class="video-title">${escapeHtml(v.titolo)}</div>
          <div class="video-meta">${escapeHtml(v.canale)} · ${escapeHtml(v.durata)}</div>
        </div>
      </a>
    `).join('');

    // Filtro per categoria: nasconde/mostra le card con una transizione di opacity, senza ricaricare la pagina
    const chips = document.querySelectorAll('#filter-chips .chip');
    const cards = document.querySelectorAll('#video-grid .video-card');

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        chips.forEach((c) => c.classList.remove('is-active'));
        chip.classList.add('is-active');

        const filter = chip.dataset.filter;
        cards.forEach((card) => {
          const match = filter === 'tutti' || card.dataset.categoria === filter;
          card.classList.toggle('is-filtered-out', !match);
        });
      });
    });
  </script>
</body>
</html>
